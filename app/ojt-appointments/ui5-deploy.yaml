# Builds the app for the HTML5 Application Repository (used by mta.yaml)
specVersion: "3.0"
metadata:
  name: ojt.appointments
type: application
resources:
  configuration:
    propertiesFileSourceEncoding: UTF-8
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: ui5-task-zipper
      afterTask: generateCachebusterInfo
      configuration:
        archiveName: ojtappointments
        relativePaths: true
        additionalFiles:
          - xs-app.json
